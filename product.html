<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail — TechZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/product_detail.css">
</head>
<body>
<div class="announcement"><span><i class="live-dot"></i> FREE ISLANDWIDE DELIVERY ON ORDERS OVER RS. 50,000</span><span>•</span><span>100% Genuine Products · Official Manufacturer Warranty</span></div>
<header class="header">
<a class="logo" href="index.html"><span class="logo-mark">T</span><span>TECH<span>ZONE</span></span></a>
<nav class="nav" aria-label="Main navigation" id="mainNav"><a href="index.html">Home</a><a class="active" href="products.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
<div class="header-actions"><button class="login-btn" id="loginBtn">Login</button><button class="cart-btn" onclick="location.href='cart.html'">Cart <span id="cartCount">0</span></button><button class="menu-btn" id="menuBtn">☰</button></div>
</header>
<main class="product-detail-page">
<div class="detail-breadcrumb"><a href="products.html">Shop</a><span>→</span><span id="detailCategory">Product</span></div>
<section class="detail-layout">
<div class="detail-image-panel"><img id="detailImage" src="images/gpu.png" alt="Product"></div>
<div class="detail-info-panel">
<span class="detail-tag" id="detailTag">PRODUCT</span><h1 id="detailName">Loading product...</h1>
<div class="detail-rating" id="detailRating"></div><div class="detail-price" id="detailPrice">Rs. 0</div>
<div class="detail-buy-row"><div class="qty-box"><button type="button" id="minusBtn">−</button><input id="detailQty" type="number" value="1" min="1"><button type="button" id="plusBtn">+</button></div><button class="primary-btn" id="addDetailBtn">Add to cart →</button></div>
<div id="detailMessage" class="detail-message"></div>
</div>
</section>
<section class="spec-section"><h2>Product Specifications</h2><div id="specTable" class="spec-table"></div></section>
</main>
<script src="js/products.js"></script><script src="js/auth.js"></script><script src="js/product_detail.js"></script>
</body></html>
